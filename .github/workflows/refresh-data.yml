name: Refresh sovereign risk data

on:
  schedule:
    - cron: "0 0 * * *"  # Every night at 00:00 UTC
  workflow_dispatch: {}  # Allows manually triggering a refresh from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch latest data
        # ACLED_API_KEY / ACLED_EMAIL are OPTIONAL repo secrets (Settings ->
        # Secrets and variables -> Actions). Without them, fetch_data.py's
        # ACLED integration prints a notice and no-ops cleanly — the curated
        # Live Conflicts tab is unaffected either way. Register a free ACLED
        # account at https://acleddata.com/register/ to enable it.
        env:
          ACLED_API_KEY: ${{ secrets.ACLED_API_KEY }}
          ACLED_EMAIL: ${{ secrets.ACLED_EMAIL }}
        run: python fetch_data.py

      - name: Recompute scores
        run: python compute_scores.py

      - name: Validate data consistency
        run: python validate_data.py

      - name: Commit refreshed data if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add raw_data.csv raw_data_long.csv scored_data.csv scored_history.csv driver_data.csv live_sovereign_risk_data.csv last_refreshed.txt
          git diff --staged --quiet && echo "No data changes" || git commit -m "Automated data refresh $(date -u +%Y-%m-%d)"
          git push
