name: Keep app warm

on:
  schedule:
    - cron: "*/5 * * * *"  # Every 5 minutes -- Render's free tier sleeps much
                            # faster than Streamlit Cloud's did, confirmed by
                            # a real spin-down/wake cycle observed within
                            # minutes of idle time during migration testing.
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping live app to prevent Render from sleeping it
        run: curl -sSf --max-time 30 -o /dev/null "https://menasa-risk-monitor.onrender.com/" || true
